name: Tests

on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.6"
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: git diff --check
