name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.11.6"
      - run: uv sync --frozen
      - run: uv run pytest -q
      - name: Root systemd containment tests
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          test "$(uname -s)" = Linux
          test -f /sys/fs/cgroup/cgroup.controllers
          test -d /run/systemd/system
          test "$(cat /proc/1/comm)" = systemd
          command -v systemd-run
          command -v systemctl
          sudo .venv/bin/python -m pytest -q tests/test_release_controller.py::test_linux_transient_runner_contains_setsid_descendants tests/test_release_controller.py::test_transient_status_uncertainty_attempts_cleanup_and_is_fatal
      - run: uv run ruff check .
      - run: git diff --check 4b825dc642cb6eb9a060e54bf8d69288fbee4904 HEAD
